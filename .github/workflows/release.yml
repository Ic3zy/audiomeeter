name: Build and Publish Release Package

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Arch Linux Package (.pkg.tar.zst)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build package inside Arch Linux container
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace archlinux:latest /bin/bash -c "
            pacman-key --init && \
            pacman-key --populate archlinux && \
            pacman -Sy --noconfirm archlinux-keyring && \
            pacman -Syu --noconfirm && \
            pacman -S --noconfirm --needed \
              base-devel \
              git \
              gcc \
              make \
              pkgconf \
              pipewire \
              wayland \
              wayland-protocols \
              cairo \
              python \
              cython \
              python-setuptools \
              pyside6 \
              python-psutil \
              python-evdev \
              python-qasync && \
            useradd -m builder || true && \
            chown -R builder:builder /workspace && \
            chmod +x /workspace/packaging/build_release.sh && \
            su builder -c "/workspace/packaging/build_release.sh '${{ github.ref_name }}'" && \
            cd /workspace/packaging && \
            FOUND=$(ls *.pkg.tar.zst 2>/dev/null | head -n 1) && \
            if [ -n "$FOUND" ] && [ "$FOUND" != "audiomeeter-${{ github.ref_name }}.pkg.tar.zst" ]; then \
              mv "$FOUND" "audiomeeter-${{ github.ref_name }}.pkg.tar.zst"; \
            fi && \
            chmod -R 777 /workspace
          "

      - name: Generate Release Notes & Changelog
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --oneline --no-merges ${PREV_TAG}..${TAG} | sed 's/^[a-f0-9]* /- /')
          else
            CHANGES=$(git log --oneline --no-merges -n 15 | sed 's/^[a-f0-9]* /- /')
          fi

          if [ -z "$CHANGES" ]; then
            CHANGES="- Initial release build and stability improvements."
          fi

          cat << EOF > ${{ runner.temp }}/release_body.md
          # AudioMeeter ${TAG}

          A high-performance, low-latency virtual audio mixer for Linux built natively on PipeWire.

          ## ⚡ Quick One-Line Installation (Arch Linux / Manjaro / EndeavourOS)

          Copy and paste this single command into your terminal to automatically download, install, and clean up the package:

          \`\`\`bash
          curl -sSLfO https://github.com/${REPO}/releases/download/${TAG}/audiomeeter-${TAG}.pkg.tar.zst && sudo pacman -U --noconfirm audiomeeter-${TAG}.pkg.tar.zst && rm -f audiomeeter-${TAG}.pkg.tar.zst
          \`\`\`

          ---

          ## 📝 What's Changed in this Release

          ${CHANGES}

          ---

          ## 💡 Key Features
          - **PipeWire Native C Core**: Real-time SIMD SSE4.2 audio routing engine (\`libengine.so\`).
          - **Matrix Audio Routing**: 3 Hardware Inputs & 2 Virtual Inputs to 3 Hardware Outputs & 2 Virtual Sinks.
          - **Dynamic Device Hot-Swapping**: Switch microphones/headphones without audio drops or PipeWire crashes.
          - **Parametric EQ & Mono Control**: 3-band Biquad filters (Bass, Mid, Treble) & Mono toggles per input.
          - **Wayland OSD Overlay**: Hardware-accelerated Volume OSD rendered via \`zwlr_layer_shell_v1\` (\`libosd.so\`).
          EOF

      - name: Verify Release Asset File
        run: |
          TAG="${{ github.ref_name }}"
          TARGET="packaging/audiomeeter-${TAG}.pkg.tar.zst"
          if [ ! -f "$TARGET" ]; then
            FOUND=$(ls packaging/*.pkg.tar.zst 2>/dev/null | head -n 1)
            if [ -n "$FOUND" ]; then
              sudo mv "$FOUND" "$TARGET"
            else
              echo "[!] Error: No package file found to upload!"
              exit 1
            fi
          fi
          echo "[+] Verified release asset: $TARGET"

      - name: Upload Package Asset to GitHub Release Tag
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release_body.md
          files: packaging/audiomeeter-${{ github.ref_name }}.pkg.tar.zst
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
