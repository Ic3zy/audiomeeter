name: Build and Publish Release Package

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Arch Linux Package (.pkg.tar.zst)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build package inside Arch Linux container
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace archlinux:latest /bin/bash -c "
            pacman-key --init && \
            pacman-key --populate archlinux && \
            pacman -Sy --noconfirm archlinux-keyring && \
            pacman -Syu --noconfirm && \
            pacman -S --noconfirm --needed \
              base-devel \
              git \
              gcc \
              make \
              pkgconf \
              pipewire \
              wayland \
              wayland-protocols \
              cairo \
              python \
              cython \
              python-setuptools \
              pyside6 \
              python-psutil \
              python-evdev \
              python-qasync && \
            useradd -m builder && \
            chown -R builder:builder /workspace && \
            chmod +x /workspace/packaging/build_release.sh && \
            su builder -c '/workspace/packaging/build_release.sh' && \
            chmod -R 777 /workspace
          "

      - name: Upload Package Asset to GitHub Release Tag
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          files: packaging/*.pkg.tar.zst
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
