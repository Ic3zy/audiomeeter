name: Build and Publish Release Package

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Arch Linux & Ubuntu/Debian Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Sync and Commit src/version.json with GitHub Tag Name
        run: |
          TAG="${{ github.ref_name }}"
          CLEAN_VER=$(echo "$TAG" | grep -oP '\d+(\.\d+)+' | head -n 1)
          if [ -z "$CLEAN_VER" ]; then
            CLEAN_VER="0.0.127"
          fi
          echo "[+] Syncing src/version.json with tag: $TAG (clean version: $CLEAN_VER)"
          cat << EOF > src/version.json
          {
            "version": "${CLEAN_VER}",
            "tag_name": "${TAG}"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/version.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(release): update version.json to ${TAG} [skip ci]"
            git push origin HEAD:dev || git push origin HEAD:main || true
          fi

      - name: Build Arch Linux package (.pkg.tar.zst) inside Arch container
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace archlinux:latest /bin/bash -c "
            pacman-key --init && \
            pacman-key --populate archlinux && \
            pacman -Sy --noconfirm archlinux-keyring && \
            pacman -Syu --noconfirm && \
            pacman -S --noconfirm --needed \
              base-devel \
              git \
              gcc \
              make \
              pkgconf \
              pipewire \
              wayland \
              wayland-protocols \
              cairo \
              python \
              cython \
              python-setuptools \
              pyside6 \
              python-psutil \
              python-evdev \
              python-qasync && \
            useradd -m builder || true && \
            chown -R builder:builder /workspace && \
            chmod +x /workspace/packaging/build_release.sh && \
            su builder -c \"/workspace/packaging/build_release.sh '${{ github.ref_name }}'\" && \
            cd /workspace/packaging && \
            FOUND=\$(ls *.pkg.tar.zst 2>/dev/null | head -n 1) && \
            if [ -n \"\$FOUND\" ] && [ \"\$FOUND\" != \"audiomeeter-${{ github.ref_name }}.pkg.tar.zst\" ]; then \
              mv \"\$FOUND\" \"audiomeeter-${{ github.ref_name }}.pkg.tar.zst\"; \
            fi && \
            chmod -R 777 /workspace
          "

      - name: Build Ubuntu/Debian package (.deb)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc \
            make \
            pkg-config \
            libpipewire-0.3-dev \
            libwayland-dev \
            libwayland-bin \
            libcairo2-dev \
            dpkg-dev
          chmod +x packaging/build_deb.sh
          packaging/build_deb.sh "${{ github.ref_name }}"

      - name: Verify Release Asset Files
        run: |
          TAG="${{ github.ref_name }}"
          # Verify Arch package
          TARGET_ARCH="packaging/audiomeeter-${TAG}.pkg.tar.zst"
          if [ ! -f "$TARGET_ARCH" ]; then
            FOUND=$(ls packaging/*.pkg.tar.zst 2>/dev/null | head -n 1)
            if [ -n "$FOUND" ]; then
              sudo mv "$FOUND" "$TARGET_ARCH"
            else
              echo "[!] Error: No Arch package file found!"
              exit 1
            fi
          fi
          echo "[+] Verified Arch asset: $TARGET_ARCH"
          # Verify .deb package
          TARGET_DEB="packaging/audiomeeter-${TAG}_amd64.deb"
          # build_deb.sh uses underscore before version, find it
          FOUND_DEB=$(ls packaging/audiomeeter_${TAG}_amd64.deb 2>/dev/null || ls packaging/audiomeeter*amd64.deb 2>/dev/null | head -n 1 || true)
          if [ -z "$FOUND_DEB" ]; then
            echo "[!] Error: No .deb package file found!"
            exit 1
          fi
          # Normalize to a clean final name
          mv "$FOUND_DEB" "packaging/audiomeeter-${TAG}-ubuntu-amd64.deb" 2>/dev/null || true
          TARGET_DEB="packaging/audiomeeter-${TAG}-ubuntu-amd64.deb"
          echo "[+] Verified Ubuntu/Debian asset: $TARGET_DEB"

      - name: Generate Release Notes & Changelog
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --oneline --no-merges ${PREV_TAG}..${TAG} | grep -v -i -E "version\.json|\[skip ci\]|chore\(release\)" | sed 's/^[a-f0-9]* /- /')
          else
            CHANGES=$(git log --oneline --no-merges -n 15 | grep -v -i -E "version\.json|\[skip ci\]|chore\(release\)" | sed 's/^[a-f0-9]* /- /')
          fi

          if [ -z "$CHANGES" ]; then
            CHANGES="- Initial release build and stability improvements."
          fi

          cat << EOF > ${{ runner.temp }}/release_body.md
          # AudioMeeter ${TAG}

          A high-performance, low-latency virtual audio mixer for Linux built natively on PipeWire.

          ---

          ## ⚡ Quick Installation

          ### 🔵 Arch Linux / Manjaro / EndeavourOS
          \`\`\`bash
          curl -sSLfO https://github.com/${REPO}/releases/download/${TAG}/audiomeeter-${TAG}.pkg.tar.zst && sudo pacman -U --noconfirm audiomeeter-${TAG}.pkg.tar.zst && rm -f audiomeeter-${TAG}.pkg.tar.zst
          \`\`\`

          ### 🟠 Ubuntu / Debian
          \`\`\`bash
          curl -sSLfO https://github.com/${REPO}/releases/download/${TAG}/audiomeeter-${TAG}-ubuntu-amd64.deb && sudo apt install -y ./audiomeeter-${TAG}-ubuntu-amd64.deb && rm -f audiomeeter-${TAG}-ubuntu-amd64.deb
          \`\`\`

          > **Note**: During the Ubuntu installation, C libraries are automatically compiled on your system (takes a few seconds).

          ---

          ## 📝 What's Changed in this Release

          ${CHANGES}

          ---

          ## 💡 Key Features
          - **PipeWire Native C Core**: Real-time SIMD SSE4.2 audio routing engine (\`libengine.so\`).
          - **Matrix Audio Routing**: 3 Hardware Inputs & 2 Virtual Inputs to 3 Hardware Outputs & 2 Virtual Sinks.
          - **Dynamic Device Hot-Swapping**: Switch microphones/headphones without audio drops or PipeWire crashes.
          - **Parametric EQ & Mono Control**: 3-band Biquad filters (Bass, Mid, Treble) & Mono toggles per input.
          - **Wayland OSD Overlay**: Hardware-accelerated Volume OSD rendered via \`zwlr_layer_shell_v1\` (\`libosd.so\`).
          EOF

      - name: Upload Package Assets to GitHub Release Tag
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release_body.md
          files: |
            packaging/audiomeeter-${{ github.ref_name }}.pkg.tar.zst
            packaging/audiomeeter-${{ github.ref_name }}-ubuntu-amd64.deb
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
